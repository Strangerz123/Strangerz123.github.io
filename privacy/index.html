<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Privacy Policies</title>
<style>
:root{--bg:#f6f8fb;--card:#fff;--text:#172033;--muted:#667085;--accent:#2563eb;--border:#e4e7ec}
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:var(--bg);color:var(--text);line-height:1.65}
.wrap{max-width:860px;margin:0 auto;padding:32px 18px 56px}.card{background:var(--card);border:1px solid var(--border);border-radius:18px;padding:28px;box-shadow:0 6px 24px rgba(16,24,40,.06)}
h1{font-size:2rem;line-height:1.2;margin:0 0 8px}h2{font-size:1.2rem;margin-top:28px}p,li{font-size:1rem}.muted{color:var(--muted)}a{color:var(--accent);text-decoration:none}a:hover{text-decoration:underline}
.badge{display:inline-block;background:#eef4ff;color:#3538cd;border-radius:999px;padding:5px 10px;font-size:.85rem;margin-bottom:14px}
.footer{margin-top:28px;padding-top:18px;border-top:1px solid var(--border);color:var(--muted);font-size:.92rem}
ul{padding-left:22px}.apps{display:grid;gap:14px;margin-top:22px}.app{display:block;padding:18px;border:1px solid var(--border);border-radius:14px;background:#fff;color:var(--text)}.app strong{display:block;font-size:1.05rem}.app span{color:var(--muted);font-size:.92rem}
@media(max-width:600px){.wrap{padding:18px 12px 36px}.card{padding:20px;border-radius:14px}h1{font-size:1.65rem}}
</style></head><body><main class="wrap"><section class="card"><div class="badge">Privacy Center</div><h1>App Privacy Policies</h1><p class="muted">Select an app to view its privacy policy.</p><div class="apps"><a class="app" href="/privacy/electricity-bill-calculator/"><strong>Electricity Bill Calculator</strong><span>View privacy policy</span></a><a class="app" href="/privacy/islamic-dua/"><strong>Islamic Dua</strong><span>View privacy policy</span></a></div><div class="footer">Hosted on GitHub Pages.</div></section></main></body></html>
